<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating - Dental Practice Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .error-box {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full">
            <!-- Loading State -->
            <div id="loadingState" class="bg-white rounded-lg shadow-lg p-8 text-center fade-in">
                <div class="flex justify-center mb-4">
                    <div class="spinner"></div>
                </div>
                <h2 class="text-2xl font-semibold text-gray-800 mb-2">Authenticating...</h2>
                <p class="text-gray-600 mb-4">Please wait while we verify your credentials.</p>
                <div class="text-sm text-gray-500">
                    <p id="statusMessage">Connecting to Microsoft...</p>
                </div>
            </div>

            <!-- Error State -->
            <div id="errorState" class="bg-white rounded-lg shadow-lg p-8 hidden error-box">
                <div class="flex justify-center mb-4">
                    <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-semibold text-gray-800 mb-2 text-center" id="errorTitle">Authentication Failed</h2>
                <p class="text-gray-600 mb-6 text-center" id="errorMessage">An error occurred during authentication.</p>
                
                <div class="space-y-3">
                    <button onclick="retryAuthentication()" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200">
                        Try Again
                    </button>
                    <button onclick="window.location.href='login.html'" 
                            class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 px-4 rounded-lg transition duration-200">
                        Back to Login
                    </button>
                </div>

                <!-- Error Details (collapsible) -->
                <div class="mt-6">
                    <button onclick="toggleErrorDetails()" 
                            class="text-sm text-gray-500 hover:text-gray-700 flex items-center mx-auto">
                        <span id="detailsToggleText">Show Details</span>
                        <svg id="detailsToggleIcon" class="w-4 h-4 ml-1 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="errorDetails" class="hidden mt-3 p-4 bg-gray-50 rounded-lg text-left">
                        <p class="text-xs text-gray-600 font-mono break-all" id="errorDetailsText"></p>
                    </div>
                </div>
            </div>

            <!-- Success State (brief) -->
            <div id="successState" class="bg-white rounded-lg shadow-lg p-8 text-center hidden fade-in">
                <div class="flex justify-center mb-4">
                    <svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-semibold text-gray-800 mb-2">Authentication Successful</h2>
                <p class="text-gray-600 mb-4">Redirecting to your dashboard...</p>
            </div>
        </div>
    </div>

    <!-- MSAL.js Library -->
    <script src="https://alcdn.msauth.net/browser/2.32.2/js/msal-browser.min.js"></script>
    
    <!-- Application Scripts -->
    <script type="module">
        import { initializeEntraAuth, handleAuthError } from './js/entra-auth.js';
        import { entraConfig } from './js/entra-config.js';

        // Global functions for buttons
        window.retryAuthentication = function() {
            window.location.href = 'login.html';
        };

        window.toggleErrorDetails = function() {
            const details = document.getElementById('errorDetails');
            const toggleText = document.getElementById('detailsToggleText');
            const toggleIcon = document.getElementById('detailsToggleIcon');
            
            if (details.classList.contains('hidden')) {
                details.classList.remove('hidden');
                toggleText.textContent = 'Hide Details';
                toggleIcon.classList.add('rotate-180');
            } else {
                details.classList.add('hidden');
                toggleText.textContent = 'Show Details';
                toggleIcon.classList.remove('rotate-180');
            }
        };

        // Update status message
        function updateStatus(message) {
            const statusEl = document.getElementById('statusMessage');
            if (statusEl) {
                statusEl.textContent = message;
            }
        }

        // Show error state
        function showError(title, message, details) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('successState').classList.add('hidden');
            
            const errorState = document.getElementById('errorState');
            errorState.classList.remove('hidden');
            
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = message;
            
            if (details) {
                document.getElementById('errorDetailsText').textContent = JSON.stringify(details, null, 2);
            }
        }

        // Show success state and redirect
        function showSuccess() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.add('hidden');
            
            const successState = document.getElementById('successState');
            successState.classList.remove('hidden');
        }

        // Main authentication handler
        async function handleAuthenticationCallback() {
            try {
                updateStatus('Initializing authentication...');
                
                // Initialize MSAL and handle redirect
                const response = await initializeEntraAuth(entraConfig);
                
                if (response && response.account) {
                    updateStatus('Authentication successful!');
                    showSuccess();
                    
                    // Short delay to show success message
                    setTimeout(() => {
                        // Redirect to intended page or dashboard
                        const returnUrl = sessionStorage.getItem('auth_return_url') || 'index.html';
                        sessionStorage.removeItem('auth_return_url');
                        window.location.href = returnUrl;
                    }, 1500);
                    
                } else {
                    // No response means user landed here directly (not from redirect)
                    console.log('No authentication response, redirecting to login');
                    window.location.href = 'login.html';
                }

            } catch (error) {
                console.error('Authentication callback error:', error);
                
                // Parse error and show friendly message
                const errorInfo = handleAuthError(error);
                
                showError(
                    errorInfo.title,
                    errorInfo.message,
                    {
                        code: errorInfo.code,
                        error: error.message || 'Unknown error',
                        stack: error.stack
                    }
                );
                
                // Log error for debugging
                console.error('Error details:', {
                    name: error.name,
                    message: error.message,
                    code: errorInfo.code,
                    stack: error.stack
                });
            }
        }

        // Handle page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Auth callback page loaded');
            handleAuthenticationCallback();
        });

        // Handle page visibility (user returns to tab)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                const currentState = document.getElementById('loadingState').classList.contains('hidden');
                if (currentState) {
                    console.log('Page became visible, checking authentication state');
                }
            }
        });

    </script>
</body>
</html>
