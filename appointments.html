<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Dental Practice Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>📅 Appointments</h1>
            </div>
            <div class="header-right">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn-secondary">Logout</button>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-bar">
            <a href="index.html">Dashboard</a>
            <a href="patients.html">Patients</a>
            <a href="appointments.html" class="active">Appointments</a>
            <a href="#">Treatments</a>
            <a href="#">Billing</a>
            <a href="#">Reports</a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <button id="btn-add-appointment" class="btn-primary">
                        ➕ New Appointment
                    </button>
                    <button id="btn-today" class="btn-secondary">
                        📍 Today
                    </button>
                    <div class="button-group">
                        <button class="btn-secondary" id="view-day">
                            Day
                        </button>
                        <button class="btn-secondary" id="view-week">
                            Week
                        </button>
                        <button class="btn-secondary" id="view-month">
                            Month
                        </button>
                        <button class="btn-secondary" id="view-list">
                            List
                        </button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <button id="btn-export-csv" class="btn-secondary">
                        💾 Export CSV
                    </button>
                    <button id="btn-print" class="btn-secondary">
                        🖨️ Print
                    </button>
                </div>
            </div>

            <!-- Date Navigation -->
            <div class="date-navigation">
                <button id="btn-prev-period" class="btn-nav">◀ Previous</button>
                <h2 id="current-period"></h2>
                <button id="btn-next-period" class="btn-nav">Next ▶</button>
            </div>

            <!-- Filters Panel -->
            <div class="filters-panel">
                <div class="filter-group">
                    <label>Search:</label>
                    <input type="text" id="search-appointments" placeholder="Patient name or appointment number...">
                </div>
                <div class="filter-group">
                    <label>Status:</label>
                    <select id="filter-status">
                        <option value="">All Statuses</option>
                        <option value="scheduled">Scheduled</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                        <option value="no_show">No Show</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Type:</label>
                    <select id="filter-type">
                        <option value="">All Types</option>
                        <option value="checkup">Checkup</option>
                        <option value="cleaning">Cleaning</option>
                        <option value="filling">Filling</option>
                        <option value="extraction">Extraction</option>
                        <option value="root_canal">Root Canal</option>
                        <option value="crown">Crown</option>
                        <option value="emergency">Emergency</option>
                        <option value="consultation">Consultation</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Patient:</label>
                    <select id="filter-patient">
                        <option value="">All Patients</option>
                    </select>
                </div>
                <button id="btn-clear-filters" class="btn-secondary">Clear Filters</button>
            </div>

            <!-- Calendar/List Container -->
            <div id="appointments-container">
                <!-- Dynamic content loaded here -->
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="loading" style="display: none;">
                Loading appointments...
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/appointments.js"></script>
    <script type="module">
        import { checkAuth, logout } from './js/auth.js';
        import { AppointmentManager } from './js/appointments.js';

        let appointmentManager;

        async function initPage() {
            const user = await checkAuth();
            if (!user) return;

            document.getElementById('user-name').textContent = user.email;

            appointmentManager = new AppointmentManager();
            await appointmentManager.init();

            wireUpButtons();
        }

        function wireUpButtons() {
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            document.getElementById('btn-add-appointment').addEventListener('click', () => appointmentManager.showAddForm());
            document.getElementById('btn-today').addEventListener('click', () => appointmentManager.goToToday());
            document.getElementById('view-day').addEventListener('click', () => appointmentManager.changeView('day'));
            document.getElementById('view-week').addEventListener('click', () => appointmentManager.changeView('week'));
            document.getElementById('view-month').addEventListener('click', () => appointmentManager.changeView('month'));
            document.getElementById('view-list').addEventListener('click', () => appointmentManager.changeView('list'));
            document.getElementById('btn-export-csv').addEventListener('click', () => appointmentManager.exportToCSV());
            document.getElementById('btn-print').addEventListener('click', () => appointmentManager.printSchedule());
            document.getElementById('btn-prev-period').addEventListener('click', () => appointmentManager.previousPeriod());
            document.getElementById('btn-next-period').addEventListener('click', () => appointmentManager.nextPeriod());
            document.getElementById('btn-clear-filters').addEventListener('click', () => appointmentManager.clearFilters());
        }

        async function handleLogout() {
            await logout();
            window.location.href = 'login.html';
        }

        // Initialize page when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }
    </script>
</body>
</html>
